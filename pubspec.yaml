name: scorm_master
description: Aula Cibermedida SCORM-Master
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  # Archivos
  file_picker: ^10.3.8
  csv: ^5.1.1
  path_provider: ^2.1.2 
  archive: ^3.6.1 
  xml: ^6.5.0
  path: ^1.9.0
  
  # Web & Utils
  universal_html: ^2.3.0
  uuid: ^4.5.2
  http: ^1.2.9
  
  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  google_generative_ai: ^0.4.0
  
  # 🔥 LA CONFIGURACIÓN ESTABLE (TODO EN V10) 🔥
  flutter_quill: ^10.7.3 
  vsc_quill_delta_to_html: ^1.0.3            
  flutter_quill_delta_from_html: ^1.3.15     
  flutter_widget_from_html: ^0.15.3          

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

# 🛑 AQUÍ ESTÁ EL TRUCO DE MAGIA 🛑
# Esto obliga a Flutter a aceptar versiones aunque se queje
dependency_overrides:
  file_picker: ^10.3.8
  intl: any  # <--- ESTO ARREGLA EL ERROR DE VERSIÓN DE FLUTTER

flutter:
  uses-material-design: true
